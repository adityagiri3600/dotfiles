$mod = SUPER
$terminal = kitty
$menu = rofi -show drun
$files = thunar
$browser = ~/.local/bin/hypr-browser.sh
$screenshot = ~/.local/bin/hypr-screenshot.sh

bind = $mod, D, exec, $menu

monitor = eDP-1, 2560x1440@60, 0x0, 1.25

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NIXOS_OZONE_WL,1
env = AQ_DRM_DEVICES,/dev/dri/card0
env = AQ_NO_MODIFIERS,1
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic

exec-once = ~/.local/bin/hypr-startup.sh

dwindle {
    preserve_split = true
    smart_split = true
    smart_resizing = true
    default_split_ratio = 1.0
    precise_mouse_move = true
}

xwayland {
    enabled = false
}

cursor {
    no_hardware_cursors = 1
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    shadow {
        enabled = true
        range = 50
        render_power = 5
        color = rgba(00000099)
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

misc {
    force_default_wallpaper = 1
}

debug {
    disable_logs = false
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = false
    }
    sensitivity = 0
}

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, E, exec, $files
bind = $mod, R, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, L, exec, sh -lc 'command -v hyprlock >/dev/null && hyprlock || loginctl lock-session'
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = , Print, exec, $screenshot
bind = SUPER, C, exec, kitty --class peaclock-widget --title peaclock-widget peaclock --config-dir ~/dotfiles/peaclock

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod ALT, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod ALT SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

bind = $mod CTRL, left, resizeactive, -80 0
bind = $mod CTRL, right, resizeactive, 80 0
bind = $mod CTRL, up, resizeactive, 0 -80
bind = $mod CTRL, down, resizeactive, 0 80

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 1%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 1%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous


bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

windowrule = match:class kitty, float on, center on, size 800 500, rounding 12
windowrule = match:class peaclock-widget, float on, center on, move 1600 80, rounding 10, opacity 0.9, size 400 300
windowrule = match:class .*blueman.*, float on, center on, size 800 500
windowrule = match:class .*pavucontrol.*, float on, center on, size 800 500
windowrule = float on, rounding 30, center on, size 192*3 108*3, pin on, match:class ^(zen)$, match:title ^(Picture-in-Picture)$