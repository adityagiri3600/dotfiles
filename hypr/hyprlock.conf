general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = true
}

background {
    monitor =
    color = rgba(12,14,19,1.0)
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 1.1
    brightness = 0.85
    vibrancy = 0.12
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(235,239,245,1.0)
    font_size = 88
    font_family = Sans
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(160,174,192,1.0)
    font_size = 22
    font_family = Sans
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(125,211,252,0.9)
    inner_color = rgba(18,22,29,0.88)
    font_color = rgba(235,239,245,1.0)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(245,158,11,0.9)
    fail_color = rgba(244,63,94,0.9)
    rounding = 14
    position = 0, -70
    halign = center
    valign = center
}
